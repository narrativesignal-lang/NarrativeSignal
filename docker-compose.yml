services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: narrative
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # Force in-network DB/Redis hosts so a host-style DATABASE_URL (localhost) in .env cannot break containers.
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/narrative
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: http://127.0.0.1:3000
      TWELVE_API_KEY: ${TWELVE_API_KEY:-}
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/narrative
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "INFO", "-Q", "default"]
    volumes:
      - ./backend:/app

  beat:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/narrative
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "INFO"]
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env.local
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    # `pnpm run dev` runs clean first (see frontend/package.json).
    # Named volume for `.next` so host bind-mount never leaves stale webpack chunks in the container.
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm run dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_next:/app/.next

volumes:
  pgdata:
  frontend_next:

